<style>
:root{
  /* Ocean Calm — dark */
  --bg-a:#071619; --bg-b:#0B2027;
  --card:#0F2830cc; --card-solid:#0F2830; --border:#1C3B42;
  --text:#EAF6F6; --muted:#8FB0B3;
  --accent:#2B93A8; --accent2:#FF9478;
  --pos:#34C77B; --neg:#FF6B6B;
  --chip:#12333B; --nav-bg:rgba(7,22,25,0.88); --shadow:0 16px 40px rgba(0,0,0,0.45);
}
html[data-theme="light"]{
  /* Ocean Calm — light */
  --bg-a:#F5FAFA; --bg-b:#EDF6F6;
  --card:#FFFFFFcc; --card-solid:#FFFFFF; --border:#E3EEEE;
  --text:#12262A; --muted:#5C7679;
  --accent:#1E7A8C; --accent2:#E8734F;
  --pos:#1FA968; --neg:#E5484D;
  --chip:#EAF3F3; --nav-bg:rgba(255,255,255,0.88); --shadow:0 10px 28px rgba(30,122,140,0.12);
}
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Secular+One&display=swap');
*{box-sizing:border-box;}
body{margin:0;background:var(--bg-a);background-image:radial-gradient(1100px 700px at 105% -10%, color-mix(in srgb, var(--accent) 18%, transparent) 0%, transparent 60%),radial-gradient(900px 650px at -10% 105%, color-mix(in srgb, var(--accent2) 14%, transparent) 0%, transparent 55%),linear-gradient(160deg,var(--bg-b),var(--bg-a));color:var(--text);font-family:'Heebo',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
.display{font-family:'Secular One',sans-serif;}
#root{display:flex;min-height:100vh;}

/* ---- Wordmark ---- */
.wordmark{display:flex;align-items:center;gap:9px;}
.wordmark svg{display:block;}
.wordmark .word{font-family:'Secular One',sans-serif;font-size:22px;letter-spacing:.5px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

/* ---- Sidebar (desktop) ---- */
.sidebar{width:224px;min-width:224px;padding:22px 16px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;background:var(--card-solid);border-left:1px solid var(--border);}
.sidebar .wordmark{margin-bottom:24px;padding:0 6px;}
.sidenav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;}
.sidebtn{display:flex;align-items:center;gap:10px;background:none;border:none;padding:11px 12px;border-radius:12px;font-size:13.5px;font-weight:600;text-align:right;color:var(--muted);transition:background .15s,color .15s,transform .1s;}
.sidebtn:hover{background:var(--chip);}
.sidebtn:active{transform:scale(.98);}
.sidebtn.active{background:color-mix(in srgb, var(--accent) 16%, transparent);color:var(--accent);}
.sidebtn .n{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--chip);flex:none;}
.sidebtn.active .n{background:var(--accent);color:#fff;}

/* ---- Main ---- */
.main{flex:1;min-width:0;}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;position:sticky;top:0;z-index:5;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
.content{max-width:960px;margin:0 auto;padding:6px 22px 110px;}
.icon-btn{border:none;border-radius:12px;padding:9px;display:flex;align-items:center;justify-content:center;background:var(--chip);color:var(--text);transition:transform .1s;}
.icon-btn:active{transform:scale(.93);}
.mobile-only{display:none;}
.desktop-only{display:flex;}

/* ---- Empty state (placeholder screens) ---- */
.empty-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px 20px;color:var(--muted);animation:fadeIn .35s ease;}

/* ---- Finance (Phase 3) ---- */
.money-toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:80;padding:11px 18px;border-radius:14px;font-weight:800;font-size:15px;box-shadow:var(--shadow);animation:toastMove 1.7s ease forwards;pointer-events:none;}
.money-toast.in{background:linear-gradient(90deg,var(--pos),var(--accent2));color:#04241d;}
.money-toast.out{background:linear-gradient(90deg,var(--neg),#ff9776);color:#3a0410;}
@keyframes toastMove{0%{opacity:0;transform:translate(-50%,8px) scale(.92);}15%{opacity:1;transform:translate(-50%,-4px) scale(1.03);}80%{opacity:1;transform:translate(-50%,-4px) scale(1);}100%{opacity:0;transform:translate(-50%,-20px) scale(.96);}}

.warn-banner{background:color-mix(in srgb, var(--neg) 12%, transparent);border:1px solid color-mix(in srgb, var(--neg) 35%, transparent);color:var(--text);border-radius:14px;padding:12px 16px;font-size:13px;margin:14px 0;line-height:1.6;}

.fin-card-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0;}
.fin-card{text-align:right;border-radius:18px;padding:16px;background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--border);box-shadow:var(--shadow);transition:transform .15s;}
.fin-card:hover{transform:translateY(-2px);}
.fin-card.grad{grid-column:1/-1;background:linear-gradient(120deg, color-mix(in srgb, var(--accent) 18%, var(--card-solid)), color-mix(in srgb, var(--accent2) 12%, var(--card-solid)));}
.fin-label{font-size:12px;color:var(--muted);font-weight:600;}
.fin-val{font-family:'Secular One',sans-serif;font-size:22px;margin-top:4px;}
.fin-val.big{font-size:32px;}
.fin-hint{font-size:11px;color:var(--muted);margin-top:4px;}

.fin-section{display:flex;flex-direction:column;gap:16px;padding-bottom:20px;}
.fin-balance-card{border-radius:20px;padding:20px;background:linear-gradient(120deg, color-mix(in srgb, var(--accent) 16%, var(--card-solid)), color-mix(in srgb, var(--accent2) 10%, var(--card-solid)));border:1px solid var(--border);box-shadow:var(--shadow);}
.fin-row-split{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);margin-top:12px;flex-wrap:wrap;}
.fin-row-split b{color:var(--text);}

.fin-block{border-radius:18px;padding:16px;background:var(--card);border:1px solid var(--border);}
.fin-block-title{font-weight:700;font-size:14px;margin-bottom:10px;}
.fin-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.fin-input{background:var(--chip);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:11px 12px;font-size:14px;font-family:'Heebo',sans-serif;min-height:44px;}
.fin-btn{grid-column:1/-1;border:none;border-radius:12px;padding:12px;font-weight:700;font-size:14px;color:#fff;background:var(--accent);min-height:44px;transition:transform .1s,filter .15s;}
.fin-btn:active{transform:scale(.97);}
.fin-btn.pos{background:var(--pos);}
.fin-btn.neg{background:var(--neg);}

.fin-list-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.fin-list-row:last-child{border-bottom:none;}
.fin-icon{font-size:18px;}
.fin-list-main{flex:1;display:flex;flex-direction:column;gap:2px;font-size:14px;}
.fin-muted{font-size:11.5px;color:var(--muted);}
.fin-del{background:none;border:none;color:var(--muted);font-size:15px;padding:6px;min-width:32px;min-height:32px;}
.fin-empty{color:var(--muted);font-size:13px;text-align:center;padding:10px 0;}
.fin-note{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.6;}
.fin-toggle{width:38px;height:22px;border-radius:12px;background:var(--chip);border:1px solid var(--border);position:relative;flex:none;transition:background .2s;}
.fin-toggle.on{background:var(--pos);border-color:var(--pos);}
.fin-toggle .dot{width:16px;height:16px;border-radius:50%;background:#fff;position:absolute;top:2px;right:2px;transition:transform .2s;}

/* ---- Goals & Achievements (Phase 4) ---- */
.icon-picker{display:flex;flex-wrap:wrap;gap:6px;max-height:130px;overflow-y:auto;}
.icon-group-label{width:100%;font-size:10px;color:var(--muted);margin-top:4px;}
.icon-choice{font-size:18px;width:36px;height:36px;border-radius:10px;background:var(--chip);border:1px solid transparent;transition:transform .12s;}
.icon-choice.sel{background:color-mix(in srgb, var(--accent) 20%, transparent);border-color:var(--accent);transform:scale(1.05);}
.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.goal-card{}
.goal-progress-track{height:9px;border-radius:6px;overflow:hidden;background:var(--chip);margin-top:10px;}
.goal-progress-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .6s cubic-bezier(.4,0,.2,1);}
.tag{font-size:10px;padding:3px 9px;border-radius:8px;font-weight:700;background:var(--chip);color:var(--muted);}
.tag.unlocked{background:color-mix(in srgb, var(--pos) 18%, transparent);color:var(--pos);}
.confetti-piece{position:fixed;top:-20px;font-size:20px;z-index:90;animation:confettiFall linear forwards;pointer-events:none;}
@keyframes confettiFall{to{transform:translateY(110vh) rotate(360deg);opacity:.25;}}
.celebrate-overlay{position:fixed;inset:0;background:rgba(4,10,12,0.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:90;animation:fadeIn .2s ease;}
.celebrate-card{background:var(--card-solid);border:1px solid var(--border);border-radius:20px;padding:26px;text-align:center;box-shadow:var(--shadow);animation:obPop .35s cubic-bezier(.2,.8,.2,1);max-width:300px;}

@media (max-width:520px){
  .goal-grid{grid-template-columns:1fr;}
}

/* ---- Savings & Goals (Phase 4) ---- */
.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.goal-card{transition:transform .15s;}
.goal-progress-track{height:9px;border-radius:6px;background:var(--chip);overflow:hidden;margin-top:10px;}
.goal-progress-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .6s cubic-bezier(.4,0,.2,1);}
.icon-picker{display:flex;flex-wrap:wrap;gap:6px;max-height:130px;overflow-y:auto;}
.icon-group-label{font-size:10px;color:var(--muted);width:100%;margin-top:4px;}
.icon-choice{font-size:18px;width:36px;height:36px;border-radius:10px;background:var(--chip);border:1px solid transparent;}
.icon-choice.sel{background:color-mix(in srgb, var(--accent) 20%, transparent);border-color:var(--accent);}
.tag{font-size:10px;padding:3px 9px;border-radius:8px;background:var(--chip);color:var(--muted);font-weight:700;white-space:nowrap;}
.tag.unlocked{background:color-mix(in srgb, var(--pos) 18%, transparent);color:var(--pos);}
.confetti-piece{position:fixed;top:-20px;font-size:18px;z-index:90;animation:confettiFall linear forwards;pointer-events:none;}
@keyframes confettiFall{to{transform:translateY(110vh) rotate(360deg);opacity:.3;}}
.celebrate-overlay{position:fixed;inset:0;background:rgba(6,10,12,0.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:90;animation:fadeIn .2s ease;}
.celebrate-card{background:var(--card-solid);border:1px solid var(--border);border-radius:20px;padding:26px;text-align:center;box-shadow:var(--shadow);max-width:300px;animation:obPop .4s cubic-bezier(.2,.8,.2,1);}

@media (max-width:520px){
  .goal-grid{grid-template-columns:1fr;}
}
.fin-toggle.on .dot{transform:translateX(-16px);}

@media (max-width:520px){
  .fin-form{grid-template-columns:1fr;}
}
.empty-screen .icon{font-size:40px;margin-bottom:14px;opacity:.9;}
.empty-screen .title{font-family:'Secular One',sans-serif;font-size:19px;color:var(--text);margin-bottom:6px;}
.empty-screen .sub{font-size:13.5px;max-width:280px;line-height:1.6;}
.empty-screen .badge{margin-top:16px;font-size:11px;padding:5px 12px;border-radius:20px;background:var(--chip);color:var(--muted);}

/* ---- Home shell ---- */
.home-hero{padding:10px 0 4px;}
.home-hero .greet{font-size:13px;color:var(--muted);}
.home-hero .brand-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
.home-card{margin-top:22px;border-radius:20px;padding:22px;background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--border);box-shadow:var(--shadow);text-align:center;}
.home-card .icon{font-size:32px;}
.home-card .title{font-family:'Secular One',sans-serif;font-size:18px;margin:10px 0 6px;}
.home-card .sub{font-size:13px;color:var(--muted);line-height:1.6;max-width:360px;margin:0 auto;}

/* ---- Bottom nav (mobile) ---- */
.bottomnav{display:none;}

/* ---- Onboarding (Phase 2) ---- */
.ob-shell{max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 20px) 22px calc(env(safe-area-inset-bottom,0px) + 30px);}
.ob-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.ob-back{background:none;border:none;color:var(--muted);font-size:13px;font-weight:600;padding:10px 4px;min-width:64px;min-height:44px;text-align:right;transition:opacity .15s;}
.ob-back.invisible{visibility:hidden;pointer-events:none;}
.ob-progress-track{height:5px;border-radius:4px;background:var(--chip);overflow:hidden;margin-bottom:8px;}
.ob-progress-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s cubic-bezier(.4,0,.2,1);}
.ob-body{flex:1;display:flex;flex-direction:column;justify-content:center;animation:obIn .32s cubic-bezier(.2,.8,.2,1);}
@keyframes obIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.ob-card{text-align:center;}
.ob-emoji{font-size:38px;margin-bottom:10px;}
.ob-title{font-size:20px;margin-bottom:6px;}
.ob-sub{font-size:13.5px;color:var(--muted);line-height:1.6;margin-bottom:18px;}
.ob-fields{text-align:right;}
.ob-input{width:100%;background:var(--chip);border:1px solid var(--border);color:var(--text);border-radius:14px;padding:14px 16px;font-size:15.5px;font-family:'Heebo',sans-serif;transition:border-color .15s;}
.ob-input:focus{border-color:var(--accent);outline:none;}
.ob-input-error{border-color:var(--neg)!important;animation:obShake .32s;}
@keyframes obShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
.ob-row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
.ob-btn-primary{width:100%;border:none;border-radius:14px;padding:15px;font-weight:700;font-size:15px;color:#fff;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:transform .12s,filter .15s;}
.ob-btn-primary:disabled{opacity:.4;pointer-events:none;}
.ob-btn-primary:active{transform:scale(.97);}
.ob-skip-link{display:block;width:100%;background:none;border:none;color:var(--muted);font-size:12.5px;text-align:center;padding:12px 0 0;text-decoration:underline;text-underline-offset:3px;}
.ob-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
.ob-chip{background:var(--chip);border:1px solid var(--border);color:var(--text);border-radius:22px;padding:12px 16px;min-height:44px;display:inline-flex;align-items:center;font-size:13.5px;font-weight:600;transition:transform .12s,background .15s,border-color .15s;}
.ob-chip:active{transform:scale(.95);}
.ob-chip.sel{background:color-mix(in srgb, var(--accent) 18%, transparent);border-color:var(--accent);color:var(--accent);}
.ob-icon-picker{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
.ob-icon-choice{font-size:20px;width:44px;height:44px;border-radius:12px;background:var(--chip);border:1px solid transparent;transition:transform .12s;}
.ob-icon-choice.sel{background:color-mix(in srgb, var(--accent) 20%, transparent);border-color:var(--accent);transform:scale(1.06);}
.ob-toggle-btn{background:var(--chip);border:1px solid var(--border);color:var(--muted);border-radius:14px;padding:0 12px;min-height:44px;font-size:12.5px;font-weight:600;}
.ob-toggle-btn.sel{background:color-mix(in srgb, var(--accent) 18%, transparent);border-color:var(--accent);color:var(--accent);}
.ob-note{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:12px;text-align:center;}
.ob-switch-row{display:flex;align-items:center;gap:12px;justify-content:center;font-size:14px;}
.ob-switch{width:44px;height:26px;border-radius:14px;background:var(--chip);border:1px solid var(--border);position:relative;flex:none;transition:background .2s;}
.ob-switch.on{background:var(--pos);border-color:var(--pos);}
.ob-switch .dot{width:20px;height:20px;border-radius:50%;background:#fff;position:absolute;top:2px;right:2px;transition:transform .2s;}
.ob-switch.on .dot{transform:translateX(-18px);}
.ob-welcome{text-align:center;}
.ob-welcome-mark{display:flex;justify-content:center;animation:obPop .5s cubic-bezier(.2,.8,.2,1);}
@keyframes obPop{from{opacity:0;transform:scale(.7);}to{opacity:1;transform:scale(1);}}


@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

@media (max-width:860px){
  .sidebar{display:none;}
  .bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:20;padding:8px 4px calc(env(safe-area-inset-bottom,0px) + 8px);justify-content:space-around;background:var(--nav-bg);border-top:1px solid var(--border);backdrop-filter:blur(10px);}
  .bottombtn{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;padding:6px 10px;color:var(--muted);min-width:52px;min-height:44px;justify-content:center;border-radius:12px;transition:color .15s;}
  .bottombtn .n{font-size:19px;}
  .bottombtn.active{color:var(--accent);}
  .desktop-only{display:none!important;}
  .mobile-only{display:flex;}
  .content{padding:6px 16px 100px;}
  .topbar{padding-top:calc(env(safe-area-inset-top,0px) + 14px);}
}
</style>

<body>
<div id="root"></div>
<script>
/* ===================== FLOW — Foundation shell ===================== */
const esc = s => (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const greeting = () => { const h=new Date().getHours(); if(h<5) return 'לילה טוב 🌙'; if(h<12) return 'בוקר טוב 👋'; if(h<17) return 'צהריים טובים ☀️'; if(h<21) return 'ערב טוב 👋'; return 'לילה טוב 🌙'; };
const todayISO = () => new Date().toISOString().slice(0,10);
const monthKeyOf = (d) => (d||new Date()).toISOString().slice(0,7);
const monthLabelHe = (key) => { const [y,m]=key.split('-'); const names=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר']; return `${names[parseInt(m)-1]} ${y}`; };
const fmt = n => new Intl.NumberFormat('he-IL',{maximumFractionDigits:0}).format(Math.round(n||0)) + ' ₪';
const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);

/* Finance — Phase 3 */
const INCOME_SOURCES = [ {key:'salary', label:'הכנסה רגילה', icon:'💼'}, {key:'side', label:'הכנסה צדדית', icon:'🧩'}, {key:'gift', label:'מתנה', icon:'🎁'} ];
const EXPENSE_CATEGORIES = ['מזון','דיור','תחבורה','בילויים','חשבונות','קניות','אחר'];
const FIXED_CATEGORIES = ['דיור','תקשורת','מנויים','ביטוח','אחר'];

/* Savings & Goals — Phase 4 */
const GOAL_ICON_GROUPS = {
  'טיולים': ['✈️','🌴','🏖️','🗺️','🧳'],

/* ===================== Finance — Phase 3 ===================== */

/* Creates a Month record if it doesn't exist yet.
   - If it's the CURRENT calendar month: created "open" (fixedExpensesSnapshot:null),
     so fixed expenses are read live from data.fixedExpenses until it closes.
   - If it's any OTHER (past) month, entered retroactively via a manual date: created
     already "closed" — snapshotting today's active fixed expenses as the best available
     approximation, since no real historical snapshot exists for a month that was never
     open. (Documented product decision from the approved Work Prompt.) */
function ensureMonth(key){
  if(data.months[key]){
    if(!data.months[key].savings) data.months[key].savings = []; // migration safety for months created before Phase 4
    return data.months[key];
  }
  const isCurrent = key === monthKeyOf(new Date());
  data.months[key] = {
    expenseFrequencyAtTime: data.preferences.expenseFrequency,
    income: [],
    expenses: [],
    expenseMonthTotal: null,
    savings: [],
    fixedExpensesSnapshot: isCurrent ? null : snapshotActiveFixedExpenses(),
  };
  return data.months[key];
}
function snapshotActiveFixedExpenses(){
  return data.fixedExpenses.filter(f=>f.active).map(f=>({ id:f.id, name:f.name, amount:f.amount, category:f.category }));
}

/* Month Finalization: run once per render pass. If the calendar has moved past the
   month we last considered "active", freeze that old month's fixed-expenses total
   forever (snapshot it) before switching lastActiveMonthKey forward. This is what
   guarantees editing/deleting a Fixed Expense today never changes a closed month's
   historical numbers. */
function finalizeMonthsIfNeeded(){
  const todayKey = monthKeyOf(new Date());
  if(data.lastActiveMonthKey && data.lastActiveMonthKey !== todayKey){
    const prev = data.months[data.lastActiveMonthKey];
    if(prev && prev.fixedExpensesSnapshot === null){
      prev.fixedExpensesSnapshot = snapshotActiveFixedExpenses();
    }
  }
  data.lastActiveMonthKey = todayKey;
  ensureMonth(todayKey);
}

function fixedTotalForMonth(m){
  if(m.fixedExpensesSnapshot !== null) return m.fixedExpensesSnapshot.reduce((s,f)=>s+f.amount,0);
  return data.fixedExpenses.filter(f=>f.active).reduce((s,f)=>s+f.amount,0);
}
function monthIncomeCalc(m){ return (m.income||[]).reduce((s,x)=>s+x.amount,0); }
function monthExpensesCalc(m){
  const base = m.expenseFrequencyAtTime==='monthEnd' ? (m.expenseMonthTotal||0) : (m.expenses||[]).reduce((s,x)=>s+x.amount,0);
  return base + fixedTotalForMonth(m);
}
function monthBalanceCalc(m){ return monthIncomeCalc(m) - monthExpensesCalc(m); }
function monthSavingsCalc(m){ return (m.savings||[]).reduce((s,x)=>s+x.amount,0); }
function remainingCalc(m){ return monthIncomeCalc(m) - monthExpensesCalc(m) - monthSavingsCalc(m); }
function currentLiquidBalance(){
  return Object.values(data.months).reduce((s,m)=>s+monthBalanceCalc(m), 0);
}

/* ---- mutators: every write goes straight to `data` + persistSilent(); text-field
   inputs use bindLive() (Phase 2 pattern) so nothing is lost, and there's no render()
   on every keystroke. ---- */
function addIncome(entry){
  const key = entry.date.slice(0,7);
  const m = ensureMonth(key);
  m.income.unshift({ id:uid(), amount:parseFloat(entry.amount), source:entry.source, date:entry.date, note:entry.note||'' });
  persistSilent();
  showMoneyToast(parseFloat(entry.amount), 'in');
  render();
}
function removeIncome(key, id){ const m = data.months[key]; if(!m) return; m.income = m.income.filter(i=>i.id!==id); persist(); }

function addExpenseEntry(entry){
  const key = entry.date.slice(0,7);
  const m = ensureMonth(key);
  m.expenses.unshift({ id:uid(), amount:parseFloat(entry.amount), category:entry.category, date:entry.date, note:entry.note||'' });
  persistSilent();
  showMoneyToast(parseFloat(entry.amount), 'out');
  checkExcessiveExpense(parseFloat(entry.amount));
  render();
}
function removeExpense(key, id){ const m = data.months[key]; if(!m) return; m.expenses = m.expenses.filter(e=>e.id!==id); persist(); }

function setExpenseMonthTotal(key, amount){
  const m = ensureMonth(key);
  const prev = m.expenseMonthTotal||0;
  const val = parseFloat(amount)||0;
  m.expenseMonthTotal = val;
  persistSilent();
  if(val !== prev){ showMoneyToast(val-prev, val>=prev?'out':'in'); checkExcessiveExpense(val); }
  render();
}

let expenseWarning = null; // transient banner text, not persisted (derived, not user data)

  }
}

function addFixedExpense(fx){

}
function toggleFixedActive(id){ const f=data.fixedExpenses.find(x=>x.id===id); if(f) f.active=!f.active; persist(); }
function removeFixedExpense(id){ data.fixedExpenses = data.fixedExpenses.filter(f=>f.id!==id); persist(); }
function updateFixedExpense(id, patch){ const f=data.fixedExpenses.find(x=>x.id===id); if(f) Object.assign(f, patch); persistSilent(); }

function addSavingsEntry(entry){

  const m = ensureMonth(key);
  m.savings.unshift({ id:uid(), amount:parseFloat(entry.amount), date:entry.date, note:entry.note||'' });

  render();
}
function removeSavingsEntry(key, id){ const m=data.months[key]; if(!m) return; m.savings=m.savings.filter(s=>s.id!==id); persist(); }

function cumulativeSavings(){ return Object.values(data.months).reduce((s,m)=>s+monthSavingsCalc(m),0); }
function savingsStreak(){
  const keys = Object.keys(data.months).sort().reverse(); // most recent first
  let streak = 0;
  for(const k of keys){
    if(k > monthKeyOf(new Date())) continue; // ignore any future-dated stray months
    if(monthSavingsCalc(data.months[k]) > 0) streak++;
    else break;
  }
  return streak;
}

function addGoal(g){
  data.goals.unshift({ id:uid(), name:g.name, icon:g.icon, category:g.category||'', targetAmount:parseFloat(g.targetAmount), startAmount:parseFloat(g.startAmount)||0, currentAmount:parseFloat(g.startAmount)||0, targetDate:g.targetDate||'', celebrated:false, createdAt:todayISO() });
  persist();
}
function removeGoal(id){ data.goals = data.goals.filter(g=>g.id!==id); persist(); }
function updateGoal(id, patch){ const g=data.goals.find(x=>x.id===id); if(g) Object.assign(g, patch); persistSilent(); }
function contributeGoal(id, amount){
  const g = data.goals.find(x=>x.id===id);

  g.currentAmount += amount;

}

function getAchievements(){
  const streak = savingsStreak();
  const cum = cumulativeSavings();
  const anyGoalDone = data.goals.some(g=>g.currentAmount >= g.targetAmount);

  return [

}

  size = size||26;
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" fill="none">

}

function showMoneyToast(amount, type){
  if(!amount) return;
  const el = document.createElement('div');
  el.className = 'money-toast ' + (type==='in'?'in':'out');
  el.textContent = (type==='in'?'💰 +':'💸 −') + fmt(Math.abs(amount));
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1800);
}
function countUp(el, from, to){
  if(!el) return;
  const dur = 550, start = performance.now();
  function step(now){
    const p = Math.min(1, (now-start)/dur);
    const eased = 1-Math.pow(1-p,3);
    el.textContent = fmt(from + (to-from)*eased);
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function runDashboardCountUp(){
  const pend = window.__pendingCountUp;

  const prev = dashboardPrev || pend;
  countUp(document.getElementById('fc-balance'), prev.balance, pend.balance);
  countUp(document.getElementById('fc-income'), prev.income, pend.income);
  countUp(document.getElementById('fc-expenses'), prev.expenses, pend.expenses);
  countUp(document.getElementById('fc-fixed'), prev.fixed, pend.fixed);
  countUp(document.getElementById('fc-savings'), prev.savings, pend.savings);
  dashboardPrev = pend;
}

/* ===================== History — Phase 5 (read-only view layer) ===================== */
let historyOpenKey = null; // which month's detail is currently shown, or null for the list

function sortedMonthKeys(){ return Object.keys(data.months).sort(); }
function prevExistingMonthKey(key){
  const keys = sortedMonthKeys();
  const idx = keys.indexOf(key);
  return idx>0 ? keys[idx-1] : null;
}
function pctChangeCalc(a,b){ if(!a) return b>0?100:(b<0?-100:0); return Math.round(((b-a)/Math.abs(a))*100); }

function historyHTML(){
  if(historyOpenKey && data.months[historyOpenKey]) return monthDetailHTML(historyOpenKey);
  const keys = [...sortedMonthKeys()].reverse();
  return `<div class="fin-section">
    <div class="fin-block-title" style="padding:0 2px;">📆 חודשים קודמים</div>
    ${keys.length===0 ? `<div class="empty-screen" style="padding:60px 20px;"><div class="icon">📆</div><div class="sub">אין עדיין חודשים שמורים - ברגע שתוסיף הכנסה, הוצאה או חיסכון, הם יופיעו כאן.</div></div>` : `
    <div class="goal-grid">
      ${keys.map(k=>{
        const m = data.months[k];
        const inc = monthIncomeCalc(m), exp = monthExpensesCalc(m), sav = monthSavingsCalc(m), bal = monthBalanceCalc(m);
        return `<button class="fin-block goal-card" style="text-align:right;" data-open-month="${k}">
          <div style="font-weight:800;font-family:'Secular One',sans-serif;font-size:15px;">${monthLabelHe(k)}</div>
          <div class="fin-row-split" style="margin-top:8px;">
            <span>הכנסות <b>${fmt(inc)}</b></span><span>הוצאות <b>${fmt(exp)}</b></span>
          </div>
          <div class="fin-row-split" style="margin-top:4px;">
            <span style="color:var(--accent2);">חיסכון <b>${fmt(sav)}</b></span>
            <span style="color:${bal>=0?'var(--pos)':'var(--neg)'};font-weight:700;">${fmt(bal)}</span>
          </div>
        </button>`;
      }).join('')}
    </div>`}
  </div>`;
}

function monthDetailHTML(key){
  const m = data.months[key];
  const prevKey = prevExistingMonthKey(key);
  const keys = sortedMonthKeys();
  const idx = keys.indexOf(key);
  const nextKey = idx < keys.length-1 ? keys[idx+1] : null;

  const inc = monthIncomeCalc(m), exp = monthExpensesCalc(m), sav = monthSavingsCalc(m), bal = monthBalanceCalc(m), rem = remainingCalc(m);
  const regular = (m.income||[]).filter(i=>i.source==='salary').reduce((s,x)=>s+x.amount,0);
  const side = (m.income||[]).filter(i=>i.source==='side').reduce((s,x)=>s+x.amount,0);
  const gift = (m.income||[]).filter(i=>i.source==='gift').reduce((s,x)=>s+x.amount,0);
  const fixedTotal = fixedTotalForMonth(m);

  let cmpBlock = '';
  if(prevKey){
    const pm = data.months[prevKey];
    const pInc = monthIncomeCalc(pm), pExp = monthExpensesCalc(pm), pSav = monthSavingsCalc(pm);
    const line = (label, a, b) => {
      const pct = pctChangeCalc(a,b);
      const arrow = pct>0?'↑':pct<0?'↓':'→';
      const color = pct>0?'var(--pos)':pct<0?'var(--neg)':'var(--muted)';
      return `<div class="fin-row-split" style="margin-top:6px;"><span>${label}</span><span style="color:${color};font-weight:700;">${arrow} ${Math.abs(pct)}%</span></div>`;
    };
    cmpBlock = `<div class="fin-block">
      <div class="fin-block-title">השוואה לחודש הקודם (${monthLabelHe(prevKey)})</div>
      ${line('הכנסות', pInc, inc)}
      ${line('הוצאות', pExp, exp)}
      ${line('חיסכון', pSav, sav)}
    </div>`;
  }

  return `<div class="fin-section">
    <button class="fin-btn" style="width:auto;padding:8px 16px;background:var(--chip);color:var(--text);" data-close-month="1">→ כל החודשים</button>
    <div class="fin-block">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <button class="fin-del" style="font-size:20px;" data-open-month="${nextKey||''}" ${!nextKey?'disabled':''}>›</button>
        <div style="font-weight:800;font-family:'Secular One',sans-serif;font-size:17px;">${monthLabelHe(key)}</div>
        <button class="fin-del" style="font-size:20px;" data-open-month="${prevKey||''}" ${!prevKey?'disabled':''}>‹</button>
      </div>
      <div class="fin-row-split" style="margin-top:14px;"><span>💰 סה"כ הכנסות</span><b>${fmt(inc)}</b></div>
      <div class="fin-row-split" style="margin-top:6px;"><span style="padding-right:12px;">💼 צדדיות</span><span>${fmt(side)}</span></div>
      <div class="fin-row-split" style="margin-top:6px;"><span style="padding-right:12px;">🎁 מתנות</span><span>${fmt(gift)}</span></div>
      <div class="fin-row-split" style="margin-top:6px;"><span>📉 סה"כ הוצאות</span><b style="color:var(--neg);">${fmt(exp)}</b></div>
      <div class="fin-row-split" style="margin-top:6px;"><span style="padding-right:12px;">🔁 מתוכן קבועות</span><span>${fmt(fixedTotal)}</span></div>
      <div class="fin-row-split" style="margin-top:6px;"><span>🏦 חיסכון</span><b style="color:var(--accent2);">${fmt(sav)}</b></div>
      <div class="fin-row-split" style="margin-top:6px;"><span>💳 יתרת החודש</span><b style="color:${bal>=0?'var(--pos)':'var(--neg)'};">${fmt(bal)}</b></div>
      <div class="fin-row-split" style="margin-top:6px;"><span>נשאר אחרי חיסכון</span><b>${fmt(rem)}</b></div>
      <div class="fin-muted" style="margin-top:10px;">שיטת הוצאות באותו חודש: ${m.expenseFrequencyAtTime==='monthEnd'?'סכום כולל בסוף החודש':m.expenseFrequencyAtTime==='weekly'?'שבועי':'יומי'}${m.fixedExpensesSnapshot!==null?' · הוצאות קבועות קפואות (חודש סגור)':' · חודש פתוח (עדיין מתעדכן)'}</div>
    </div>
    ${cmpBlock}
  </div>`;
}

function attachHandlers(){
  document.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click', ()=>{ tab = el.dataset.nav; if(tab==='history') historyOpenKey=null; render(); }));
  document.querySelectorAll('[data-nav-more]').forEach(el=>el.addEventListener('click', ()=>{ tab = el.dataset.navMore; if(tab==='history') historyOpenKey=null; moreSheetOpen=false; render(); }));
  document.querySelectorAll('[data-action="theme"]').forEach(el=>el.addEventListener('click', toggleTheme));
  const moreBtn = document.querySelector('[data-action="more"]');
  if(moreBtn) moreBtn.addEventListener('click', ()=>{ moreSheetOpen=true; render(); });
  document.querySelectorAll('[data-action="close-more"]').forEach(el=>el.addEventListener('click', (e)=>{ if(e.target===el){ moreSheetOpen=false; render(); } }));

  const incomeForm = document.getElementById('income-form');
  if(incomeForm) incomeForm.addEventListener('submit', e=>{
    e.preventDefault();
    const f = new FormData(incomeForm);
    if(!parseFloat(f.get('amount'))) return;
    addIncome({ amount:f.get('amount'), source:f.get('source'), date:f.get('date')||todayISO(), note:f.get('note') });
  });
  document.querySelectorAll('[data-remove-income]').forEach(el=>el.addEventListener('click', ()=>{ const [k,id]=el.dataset.removeIncome.split('|'); removeIncome(k,id); }));

  const expenseForm = document.getElementById('expense-form');
  if(expenseForm) expenseForm.addEventListener('submit', e=>{
    e.preventDefault();
    const f = new FormData(expenseForm);
    if(!parseFloat(f.get('amount'))) return;
    addExpenseEntry({ amount:f.get('amount'), category:f.get('category'), date:f.get('date')||todayISO(), note:f.get('note') });
  });
  document.querySelectorAll('[data-remove-expense]').forEach(el=>el.addEventListener('click', ()=>{ const [k,id]=el.dataset.removeExpense.split('|'); removeExpense(k,id); }));

  const expenseTotalForm = document.getElementById('expense-total-form');
  if(expenseTotalForm) expenseTotalForm.addEventListener('submit', e=>{
    e.preventDefault();
    const f = new FormData(expenseTotalForm);
    setExpenseMonthTotal(monthKeyOf(new Date()), f.get('amount'));
  });

  const fixedForm = document.getElementById('fixed-form');
  if(fixedForm) fixedForm.addEventListener('submit', e=>{
    e.preventDefault();
    const f = new FormData(fixedForm);
    if(!f.get('name').trim() || !parseFloat(f.get('amount'))) return;
    addFixedExpense({ name:f.get('name'), amount:f.get('amount'), dayOfMonth:f.get('dayOfMonth'), category:f.get('category'), note:f.get('note') });
  });
  document.querySelectorAll('[data-toggle-fixed]').forEach(el=>el.addEventListener('click', ()=>toggleFixedActive(el.dataset.toggleFixed)));
  document.querySelectorAll('[data-remove-fixed]').forEach(el=>el.addEventListener('click', ()=>removeFixedExpense(el.dataset.removeFixed)));

  const savingsForm = document.getElementById('savings-form');
  if(savingsForm) savingsForm.addEventListener('submit', e=>{
    e.preventDefault();
    const f = new FormData(savingsForm);
    if(!parseFloat(f.get('amount'))) return;
    addSavingsEntry({ amount:f.get('amount'), date:f.get('date')||todayISO(), note:f.get('note') });
  });
  document.querySelectorAll('[data-remove-savings]').forEach(el=>el.addEventListener('click', ()=>{ const [k,id]=el.dataset.removeSavings.split('|'); removeSavingsEntry(k,id); }));

  const goalIconPicker = document.getElementById('goal-icon-picker');
  if(goalIconPicker) goalIconPicker.querySelectorAll('[data-goal-icon]').forEach(el=>el.addEventListener('click', ()=>{
    goalIconPickerSel = el.dataset.goalIcon;
    render();
  }));
  const goalForm = document.getElementById('goal-form');
  if(goalForm) goalForm.addEventListener('submit', e=>{
    e.preventDefault();
    const f = new FormData(goalForm);
    if(!f.get('name').trim() || !parseFloat(f.get('targetAmount'))) return;
    addGoal({ name:f.get('name'), icon:goalIconPickerSel, targetAmount:f.get('targetAmount'), startAmount:f.get('startAmount'), targetDate:f.get('targetDate') });
    goalIconPickerSel = ALL_GOAL_ICONS[0];
  });
  document.querySelectorAll('[data-remove-goal]').forEach(el=>el.addEventListener('click', ()=>removeGoal(el.dataset.removeGoal)));
  document.querySelectorAll('[data-contrib-btn]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.dataset.contribBtn;
    const input = document.querySelector(`[data-contrib-input="${id}"]`);
    const amt = parseFloat(input.value);
    if(!amt) return;
    contributeGoal(id, amt);
  }));

  document.querySelectorAll('[data-open-month]').forEach(el=>el.addEventListener('click', ()=>{
    const key = el.dataset.openMonth;
    if(!key) return; // disabled prev/next at the edge
    historyOpenKey = key;
    render();
  }));
  document.querySelectorAll('[data-close-month]').forEach(el=>el.addEventListener('click', ()=>{ historyOpenKey = null; render(); }));

  runDashboardCountUp();
}

/* ===================== Onboarding — Phase 2 ===================== */
function obStepIndex(){ return OB_QUESTION_STEPS.indexOf(data.onboardingStep); }
function goStep(step){ data.onboardingStep = step; persistSilent(); render(); }
function completeOnboarding(){ data.onboardingCompleted = true; data.onboardingStep = null; persistSilent(); render(); }
function skipAllOnboarding(){
  // explicit: use exactly the approved defaults, invent nothing
  data.onboardingCompleted = true; data.onboardingStep = null; persistSilent(); render();
}

function renderOnboarding(root){
  const step = data.onboardingStep || 'welcome';
  const qIdx = obStepIndex();
  const showProgress = OB_QUESTION_STEPS.includes(step);
  const pct = showProgress ? Math.round(((qIdx+1)/OB_QUESTION_STEPS.length)*100) : (step==='summary'?100:0);
  root.innerHTML = `
    <div class="ob-shell">
      <div class="ob-top">
        <button class="ob-back ${(step==='welcome')?'invisible':''}" data-ob="back">→ חזרה</button>
        <div class="wordmark" style="transform:scale(.85);">${wordmarkSVG(24)}<span class="word">flow</span></div>
        <span style="width:64px;"></span>
      </div>
      ${(step!=='welcome' && step!=='summary') ? `<div class="ob-progress-track"><div class="ob-progress-fill" style="width:${pct}%"></div></div>` : ''}
      <div class="ob-body" key="${step}">
        ${obStepHTML(step)}
      </div>
    </div>
  `;
  attachOnboardingHandlers(step);
}

function obShell(inner, opts){
  opts = opts||{};
  return `<div class="ob-card">
    ${opts.emoji?`<div class="ob-emoji">${opts.emoji}</div>`:''}
    ${opts.title?`<div class="ob-title display">${esc(opts.title)}</div>`:''}
    ${opts.sub?`<div class="ob-sub">${esc(opts.sub)}</div>`:''}
    <div class="ob-fields">${inner}</div>
  </div>`;
}

function obStepHTML(step){
  if(step==='welcome') return `
    <div class="ob-welcome">
      <div class="ob-welcome-mark">${wordmarkSVG(64)}</div>
      <div class="ob-title display" style="font-size:24px;margin-top:18px;">היי, נעים להכיר 👋</div>
      <div class="ob-sub" style="max-width:300px;margin:8px auto 0;">כמה שאלות קצרות כדי ש-flow תכיר אותך ותתאים את עצמה אליך. פחות מדקה.</div>
      <button class="ob-btn-primary" style="margin-top:26px;max-width:240px;" data-ob="next-from-welcome">בואו נתחיל</button>
      <button class="ob-skip-link" data-ob="skip-all">אולי מאוחר יותר</button>
    </div>`;

  if(step==='name') return obShell(`
      <input class="ob-input" id="ob-name" placeholder="איך קוראים לך?" value="${esc(data.user.name || '')}" autofocus />
      <input class="ob-input" id="ob-email" type="email" placeholder="אימייל (לא חובה)" value="${esc(data.user.email || '')}" style="margin-top:10px;" />
      ${obContinueBtn('name')}
    `, {emoji:'👋', title:'מי אתה?', sub:'רק כדי שנוכל לפנות אליך כמו שצריך.'});

  if(step==='motivation') return obShell(`
      <div class="ob-chips">
        ${MOTIVATION_OPTIONS.map(o=>`<button class="ob-chip ${data.preferences.primaryMotivation===o.key?'sel':''}" data-ob-chip="primaryMotivation:${o.key}">${o.icon} ${o.label}</button>`).join('')}
      </div>
      ${data.preferences.primaryMotivation==='other' ? `<input class="ob-input" id="ob-motivation-other" placeholder="ספר לנו בקצרה" value="${esc(data.preferences.primaryMotivationOther || '')}" style="margin-top:10px;" />` : ''}
      ${obContinueBtn('motivation', !data.preferences.primaryMotivation)}
    `, {emoji:'🧭', title:'מה הכי חשוב לך כרגע?', sub:'זה עוזר ל-flow לדבר אליך נכון.'});

  if(step==='goal') return obShell(`
      <div class="ob-icon-picker">
        ${OB_GOAL_ICONS.map((ic,i)=>`<button type="button" class="ob-icon-choice ${data.onboardingGoalDraft.icon===ic?'sel':''}" data-ob-icon="${ic}">${ic}</button>`).join('')}
      </div>
      <input class="ob-input" id="ob-goal-name" placeholder="שם היעד (למשל: טיסה לחו״ל)" value="${esc(data.onboardingGoalDraft.name || '')}" style="margin-top:12px;" />
      <div class="ob-row2">
        <input class="ob-input" id="ob-goal-amount" type="number" placeholder="סכום יעד ₪" value="${esc(data.onboardingGoalDraft.amount || '')}" />
        <input class="ob-input" id="ob-goal-date" type="date" value="${esc(data.onboardingGoalDraft.date || '')}" />
      </div>
      <button class="ob-btn-primary" data-ob="save-goal" style="margin-top:14px;">הוספת היעד וממשיכים</button>
      <button class="ob-skip-link" data-ob="skip-goal">אין לי יעד כרגע</button>
    `, {emoji:'🎯', title:'יש לך יעד חיסכון בראש?', sub:'אפשר גם לדלג ולהוסיף בהמשך.'});

  if(step==='savings') return obShell(`
      <input class="ob-input" id="ob-savings" type="number" placeholder="לדוגמה: 500" value="${esc(data.preferences.desiredMonthlySavings ?? '')}" />
      ${obContinueBtn('savings')}
      <button class="ob-skip-link" data-ob="savings-unknown">עוד לא יודע - אפשר לעדכן בהמשך</button>
    `, {emoji:'🏦', title:'כמה תרצה לחסוך בחודש?', sub:'הערכה גסה מספיקה לגמרי.'});

  if(step==='expenses') return obShell(`
      <div class="ob-chips">
        ${EXPENSE_FREQ_OPTIONS.map(o=>`<button class="ob-chip ${data.preferences.expenseFrequency===o.key?'sel':''}" data-ob-chip="expenseFrequency:${o.key}">${o.icon} ${o.label}</button>`).join('')}
      </div>
      <div class="ob-sub" style="margin-top:16px;">מתי בערך נכנסת המשכורת שלך?</div>
      <div class="ob-row2" style="margin-top:8px;">
        <input class="ob-input" id="ob-salary-day" type="number" min="1" max="31" placeholder="יום בחודש (1-31)" value="${esc(data.preferences.salaryDay ?? '')}" ${data.preferences.salaryDayUnset?'disabled':''} />
        <button type="button" class="ob-toggle-btn ${data.preferences.salaryDayUnset?'sel':''}" data-ob="toggle-salary-unset">לא רוצה לציין</button>
      </div>
      ${obContinueBtn('expenses', !data.preferences.expenseFrequency)}
    `, {emoji:'📅', title:'איך נוח לך לנהל הוצאות?', sub:'זה יקבע איך מסך הכסף ייראה אצלך.'});

  if(step==='threshold') return obShell(`
      <input class="ob-input" id="ob-threshold" type="number" placeholder="לדוגמה: 400" value="${esc(data.preferences.excessiveExpenseThreshold ?? '')}" ${data.preferences.learnThresholdGradually?'disabled':''} />
      <button type="button" class="ob-toggle-btn ${data.preferences.learnThresholdGradually?'sel':''}" style="margin-top:10px;width:100%;" data-ob="toggle-threshold-learn">תן ל-flow ללמוד את זה בהדרגה</button>
      ${obContinueBtn('threshold')}
      <div class="ob-note">רק תוך כדי שימוש - flow לעולם לא תשלח על זה התראת דחיפה, רק תציג בעדינות בתוך האפליקציה.</div>
    `, {emoji:'⚠️', title:'הוצאה חריגה עבורך מתחילה בערך מ...', sub:''});

  if(step==='reminders') return obShell(`
      <div class="ob-switch-row">
        <button class="ob-switch ${data.preferences.notifications.enabled?'on':''}" data-ob="toggle-notifications"><span class="dot"></span></button>
        <span>לקבל תזכורות עדינות בתוך flow</span>
      </div>
      <div class="ob-note">בשלב הזה מדובר בתזכורות שמופיעות רק כשה-flow פתוחה - לא התראות דחיפה.</div>
      <button class="ob-btn-primary" data-ob="next-from-reminders" style="margin-top:18px;">המשך</button>
    `, {emoji:'🔔', title:'תזכורות עדינות', sub:''});

  if(step==='summary'){
    const name = data.user.name ? esc(data.user.name) : '';
    const bits = [];
    if(data.preferences.primaryMotivation){
      const m = MOTIVATION_OPTIONS.find(o=>o.key===data.preferences.primaryMotivation);
      if(m) bits.push(`המטרה שלך היא ${m.label.replace(/^ל/,'ל')}`);
    }
    if(data.goals[0]) bits.push(`יש לך יעד: ${esc(data.goals[0].name)} (${data.goals[0].icon})`);
    if(data.preferences.desiredMonthlySavings) bits.push(`תרצה לחסוך כ-${data.preferences.desiredMonthlySavings} ₪ בחודש`);
    return `<div class="ob-welcome">
      <div class="ob-emoji" style="font-size:44px;">🎉</div>
      <div class="ob-title display" style="font-size:22px;margin-top:10px;">${name?`היי ${name} 👋`:'מעולה 👋'}</div>
      <div class="ob-sub" style="max-width:320px;margin:10px auto 0;">${bits.length? 'סימנו ש'+bits.join(', ')+'. ' : ''}flow מוכנה - אפשר להשלים ולשנות הכל בכל רגע דרך ההגדרות.</div>
      <button class="ob-btn-primary" style="margin-top:24px;max-width:240px;" data-ob="finish">בואו נתחיל</button>
    </div>`;
  }
  return '';
}

function obContinueBtn(stepKey, disabled){
  return `<button class="ob-btn-primary" data-ob="continue" data-ob-step="${stepKey}" ${disabled?'disabled':''} style="margin-top:16px;">המשך</button>`;
}

function attachOnboardingHandlers(step){
  document.querySelectorAll('[data-ob="back"]').forEach(el=>el.addEventListener('click', ()=>{
    const idx = OB_STEPS.indexOf(step);
    if(idx>0) goStep(OB_STEPS[idx-1]);
  }));
  const skipAll = document.querySelector('[data-ob="skip-all"]');
  if(skipAll) skipAll.addEventListener('click', skipAllOnboarding);
  const nextWelcome = document.querySelector('[data-ob="next-from-welcome"]');
  if(nextWelcome) nextWelcome.addEventListener('click', ()=>goStep('name'));

  document.querySelectorAll('[data-ob-chip]').forEach(el=>el.addEventListener('click', ()=>{
    const [field, val] = el.dataset.obChip.split(':');
    data.preferences[field] = val;
    persistSilent();
    render();
  }));

  document.querySelectorAll('[data-ob-icon]').forEach(el=>el.addEventListener('click', ()=>{
    data.onboardingGoalDraft.icon = el.dataset.obIcon;
    persistSilent();
    render();
  }));

  /* Live, per-keystroke save: writes straight into `data` + localStorage on
     every 'input' event, WITHOUT calling render() — so focus/cursor position
     in the field is never disturbed. Each field maps to its real place in
     the Data Model (no separate/parallel storage). */
  bindLive('ob-name', v => { data.user.name = v; });
  bindLive('ob-email', v => { data.user.email = v; });
  bindLive('ob-motivation-other', v => { data.preferences.primaryMotivationOther = v; });
  bindLive('ob-goal-name', v => { data.onboardingGoalDraft.name = v; });
  bindLive('ob-goal-amount', v => { data.onboardingGoalDraft.amount = v; });
  bindLive('ob-goal-date', v => { data.onboardingGoalDraft.date = v; });
  bindLive('ob-savings', v => {
    data.preferences.desiredMonthlySavings = v==='' ? null : parseFloat(v);
    if(v!=='') data.preferences.learnSavingsGradually = false;
  });
  bindLive('ob-salary-day', v => { data.preferences.salaryDay = v==='' ? null : parseInt(v); });
  bindLive('ob-threshold', v => {
    data.preferences.excessiveExpenseThreshold = v==='' ? null : parseFloat(v);
  });

  const saveGoalBtn = document.querySelector('[data-ob="save-goal"]');
  if(saveGoalBtn) saveGoalBtn.addEventListener('click', ()=>{
    const g = data.onboardingGoalDraft;
    const name = (g.name||'').trim();
    const amount = parseFloat(g.amount);
    if(!name || !amount){
      const nameInput = document.getElementById('ob-goal-name');
      if(nameInput){ nameInput.classList.add('ob-input-error'); }
      const amtInput = document.getElementById('ob-goal-amount');
      if(!amount && amtInput){ amtInput.classList.add('ob-input-error'); }
      return;
    }
    data.goals = [{ id: Math.random().toString(36).slice(2), name, icon: g.icon||OB_GOAL_ICONS[0], targetAmount: amount, currentAmount:0, targetDate: g.date||'' }];
    persistSilent();
    goStep('savings');
  });
  const skipGoal = document.querySelector('[data-ob="skip-goal"]');
  if(skipGoal) skipGoal.addEventListener('click', ()=>{ goStep('savings'); });

  const savingsUnknown = document.querySelector('[data-ob="savings-unknown"]');
  if(savingsUnknown) savingsUnknown.addEventListener('click', ()=>{
    data.preferences.desiredMonthlySavings = null;
    data.preferences.learnSavingsGradually = true;
    persistSilent();
    goStep('expenses');
  });

  const toggleSalaryUnset = document.querySelector('[data-ob="toggle-salary-unset"]');
  if(toggleSalaryUnset) toggleSalaryUnset.addEventListener('click', ()=>{
    data.preferences.salaryDayUnset = !data.preferences.salaryDayUnset;
    if(data.preferences.salaryDayUnset) data.preferences.salaryDay = null;
    persistSilent();
    render();
  });

  const toggleThresholdLearn = document.querySelector('[data-ob="toggle-threshold-learn"]');
  if(toggleThresholdLearn) toggleThresholdLearn.addEventListener('click', ()=>{
    data.preferences.learnThresholdGradually = !data.preferences.learnThresholdGradually;
    if(data.preferences.learnThresholdGradually) data.preferences.excessiveExpenseThreshold = null;
    persistSilent();
    render();
  });

  const toggleNotif = document.querySelector('[data-ob="toggle-notifications"]');
  if(toggleNotif) toggleNotif.addEventListener('click', ()=>{
    data.preferences.notifications.enabled = !data.preferences.notifications.enabled;
    persistSilent();
    render();
  });
  const nextReminders = document.querySelector('[data-ob="next-from-reminders"]');
  if(nextReminders) nextReminders.addEventListener('click', ()=>goStep('summary'));

  const finishBtn = document.querySelector('[data-ob="finish"]');
  if(finishBtn) finishBtn.addEventListener('click', completeOnboarding);

  const continueBtn = document.querySelector('[data-ob="continue"]');
  if(continueBtn) continueBtn.addEventListener('click', ()=>{
    if(step==='name' && !(data.user.name||'').trim()){
      const nameInput = document.getElementById('ob-name');
      if(nameInput){ nameInput.classList.add('ob-input-error'); nameInput.focus(); }
      return;
    }
    const idx = OB_STEPS.indexOf(step);
    goStep(OB_STEPS[idx+1]);
  });
}

/* Binds a text/number input for immediate, render-free persistence. */
function bindLive(id, onInput){
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('input', ()=>{
    onInput(el.value);
    persistSilent();
    el.classList.remove('ob-input-error');
  });
}

render();
</script>
</body>
</html>
